<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Combate Aéreo</title>

<body>

    <div id="popup">
        <div id="text">
            <h2>Controles del Juego</h2>
            <p>Para desplazarse utiliza:</p>
            <p>⬆️ Arriba — ⬇️ Abajo — ⬅️ Izquierda — ➡️ Derecha</p>
            <p id="msgTecla">Para disparar utiliza la tecla <strong>Espaciadora</strong></p>
            <br>
            <!-- <p><em>Presiona ENTER para comenzar</em></p>
            <p><em>Toca la PANTALLA comenzar</em></p>          -->
            <!-- Desktop -->
            <p id="msgEnter"><em>Presiona ENTER para comenzar</em></p>
            
            <!-- Responsive -->
            <p id="msgTouch"><em>Toca la PANTALLA para comenzar</em></p>

        </div>
    </div>

    <!-- <div id="gameArea">
        <img src="/assets/img/airplane-svgrepo-com.svg" class="avion" id="avion">
    </div> -->

    <div class="controles-movil">
        <div class="flechas">
            <button id="btnUp">⬆️</button>
            <div class="medio">
                <button id="btnLeft">⬅️</button>
                <button id="btnRight">➡️</button>
            </div>
            <button id="btnDown">⬇️</button>
        </div>
    
        <button id="btnShoot" class="disparar">🔥 Disparar</button>
    </div>

    


    <canvas id="gameCanvas">
        <img src="assets/img/airplane-svgrepo-com.svg" class="avion">
    </canvas>

        <div class="nube nube1"><img src="/assets/img/dark-cloud-shape-svgrepo-com.svg" alt=""></div>

    </div> -->

    <div class="capa capa1">

</div>

             <!-- desktop -->

            <!-- responsive -->
            <p id="msgTouchGO"><em>Toca la PANTALLA para reiniciar</em></p>

        </div>
